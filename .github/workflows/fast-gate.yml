name: Achievements Fast Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-gate:
    name: Fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify frozen add-on contract
        run: uv run python scripts/verify_frozen.py

      - name: Verify Codex plugin contract
        run: uv run python scripts/verify_codex_plugin.py

      - name: Verify predicate registry
        run: uv run python scripts/verify_predicates.py

      - name: Run ruff
        run: uv run ruff check .

      - name: Run pytest
        run: uv run pytest
